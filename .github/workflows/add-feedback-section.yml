name: Add feedback section

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-feedback-section.yml

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add bilingual feedback section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css_link = '<link href="assets/recommendations.css" rel="stylesheet"/>'
          if css_link not in html:
              html = html.replace('</head>', css_link + '\n</head>', 1)

          spanish_section = '''<section id="feedback">
          <div class="container">
          <div class="section-head">
          <div>
          <h2>Feedback recibido</h2>
          <p>Lo que clientes y líderes con quienes he trabajado destacan sobre mi capacidad para convertir problemas complejos en soluciones de datos prácticas, rápidas y confiables.</p>
          </div>
          </div>
          <div class="feedback-grid" data-feedback-lang="es" id="feedback-grid-es"></div>
          </div>
          </section>
          '''

          if 'id="feedback"' not in html:
              marker = '<section id="contact">'
              if marker not in html:
                  raise SystemExit('Spanish contact section marker was not found.')
              html = html.replace(marker, spanish_section + marker, 1)

          english_section = '''<section id="feedback-en">
          <div class="container">
          <div class="section-head">
          <div>
          <h2>Client feedback</h2>
          <p>What clients and leaders I have worked with say about my ability to turn complex business and data challenges into practical, reliable solutions.</p>
          </div>
          </div>
          <div class="feedback-grid" data-feedback-lang="en" id="feedback-grid-en"></div>
          </div>
          </section>
          '''

          if 'id="feedback-en"' not in html:
              marker = '<section id="contact-en">'
              if marker not in html:
                  raise SystemExit('English contact section marker was not found.')
              html = html.replace(marker, english_section + marker, 1)

          if 'data-i18n="navFeedback"' not in html:
              old_nav = '<a data-i18n="navClientProjects" href="#portfolio">Proyectos de clientes</a><a data-i18n="navPersonalProjects"'
              new_nav = '<a data-i18n="navClientProjects" href="#portfolio">Proyectos de clientes</a>\n<a data-i18n="navFeedback" href="#feedback">Feedback</a>\n<a data-i18n="navPersonalProjects"'
              if old_nav not in html:
                  raise SystemExit('Navigation insertion marker was not found.')
              html = html.replace(old_nav, new_nav, 1)

              html = html.replace(
                  "navClientProjects: 'Proyectos de clientes',\n        navPersonalProjects:",
                  "navClientProjects: 'Proyectos de clientes',\n        navFeedback: 'Feedback',\n        navPersonalProjects:",
                  1,
              )
              html = html.replace(
                  "navClientProjects: '#portfolio',\n          navContact:",
                  "navClientProjects: '#portfolio',\n          navFeedback: '#feedback',\n          navContact:",
                  1,
              )
              html = html.replace(
                  "navClientProjects: 'Client projects',\n        navPersonalProjects:",
                  "navClientProjects: 'Client projects',\n        navFeedback: 'Feedback',\n        navPersonalProjects:",
                  1,
              )
              html = html.replace(
                  "navClientProjects: '#portfolio-en',\n          navContact:",
                  "navClientProjects: '#portfolio-en',\n          navFeedback: '#feedback-en',\n          navContact:",
                  1,
              )

          script_tag = '<script src="assets/recommendations.js"></script>'
          if script_tag not in html:
              html = html.replace('</body>', script_tag + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit landing-page update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already contains the feedback section."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add bilingual client feedback section"
          git push origin main
